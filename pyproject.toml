[project]
name = "edumi-ops"
version = "1.0.0"
description = "Pipeline determinístico de auditoria, higienização, raspagem verificada e exportação para o Projeto Edumi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "dnspython>=2.7.0",
    "httpx>=0.27.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
edumi = "tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
